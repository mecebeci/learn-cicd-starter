name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build the app
        run: bash scripts/buildprod.sh

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: notely-474612
          service_account_key: ${{ secrets.GCP_CREDENTIALS }}
          export_default_credentials: true

      - name: Verify gcloud auth
        run: |
          gcloud auth list
          gcloud config list

      - name: Submit image to Cloud Build
        run: |
          gcloud builds submit \
            --project=notely-474612 \
            --tag=us-central1-docker.pkg.dev/notely-474612/notely-ar-repo/notely:latest
