name: cd

on:
  push:
    branches: [main]

jobs:
  Deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Go tests
        run: go test ./...

      - name: Build the app
        run: bash scripts/buildprod.sh

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_CREDENTIALS }}
          export_default_credentials: true

      - name: Set active GCP project
        run: |
          PROJECT_ID=$(jq -r '.project_id' <<< '${{ secrets.GCP_CREDENTIALS }}')
          gcloud config set project "$PROJECT_ID"

      - name: Submit image to Cloud Build
        run: |
          PROJECT_ID=$(jq -r '.project_id' <<< '${{ secrets.GCP_CREDENTIALS }}')
          gcloud builds submit \
            --project="$PROJECT_ID" \
            --tag us-central1-docker.pkg.dev/$PROJECT_ID/notely-ar-repo/notely:latest
